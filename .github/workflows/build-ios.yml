name: Build QVAS iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Create the iOS project
        run: npx cap add ios

      - name: Use the QVAS app icon
        run: |
          find ios/App/App/Assets.xcassets/AppIcon.appiconset -name '*.png' -exec cp icon.png {} \;

      - name: Allow background GPS and sound, landscape only
        run: |
          PL=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :UIBackgroundModes" $PL 2>/dev/null || true
          $PB -c "Add :UIBackgroundModes array" $PL
          $PB -c "Add :UIBackgroundModes:0 string audio" $PL
          $PB -c "Add :UIBackgroundModes:1 string location" $PL
          $PB -c "Delete :NSLocationWhenInUseUsageDescription" $PL 2>/dev/null || true
          $PB -c "Add :NSLocationWhenInUseUsageDescription string QVAS uses your location to announce the next station." $PL
          $PB -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" $PL 2>/dev/null || true
          $PB -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string QVAS keeps using your location in the background so announcements continue when the screen is locked." $PL
          $PB -c "Delete :WKAppBoundDomains" $PL 2>/dev/null || true
          $PB -c "Add :WKAppBoundDomains array" $PL
          $PB -c "Add :WKAppBoundDomains:0 string qraillife.github.io" $PL
          $PB -c "Delete :UISupportedInterfaceOrientations" $PL 2>/dev/null || true
          $PB -c "Add :UISupportedInterfaceOrientations array" $PL
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" $PL
          $PB -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" $PL
          cat $PL

      - name: Keep the silent sound playing when the screen locks
        run: |
          AD=ios/App/App/AppDelegate.swift
          perl -0pi -e 's/import UIKit\n/import UIKit\nimport AVFoundation\n/' $AD
          perl -0pi -e 's/(didFinishLaunchingWithOptions[^\n]*\n)/$1        try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [.mixWithOthers])\n        try? AVAudioSession.sharedInstance().setActive(true)\n/' $AD
          grep -n "AVAudioSession" $AD

      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Make the .ipa
        working-directory: ios/App/build
        run: |
          mkdir Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qr QVAS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: QVAS-ipa
          path: ios/App/build/QVAS.ipa

      - name: Publish release and AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          TAG="build-${{ github.run_number }}"
          IPA=ios/App/build/QVAS.ipa
          SIZE=$(wc -c < "$IPA" | tr -d ' ')
          gh release create "$TAG" "$IPA" --title "QVAS $VERSION" --notes "Automatic build $VERSION"
          jq -n \
            --arg ver "$VERSION" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/QVAS.ipa" \
            --arg icon "https://raw.githubusercontent.com/${{ github.repository }}/main/icon.png" \
            --argjson size "$SIZE" \
            '{name:"QVAS by LARPTransit", identifier:"au.larptransit.qvas.source", apps:[{name:"QVAS", bundleIdentifier:"au.larptransit.qvas", developerName:"LARPTransit", subtitle:"Queensland Rail style announcements", version:$ver, versionDate:$date, downloadURL:$url, localizedDescription:"QVAS Mobile - the QVAS announcement screen for iPhone.", iconURL:$icon, tintColor:"E9AF3B", size:$size}]}' > altstore.json
          cat altstore.json
          git config user.name "qvas-build"
          git config user.email "qvas-build@users.noreply.github.com"
          git add altstore.json
          git commit -m "Update AltStore source to $VERSION"
          git push
